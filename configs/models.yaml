# One entry per model. The key is the model's name in every table and its folder under res/.
# api_model is the OpenRouter identifier. To add a model, add an entry and pass its key to
# `python -m peerreview run --models <key>`.
gpt-5.1:                {family: GPT,      api_model: openai/gpt-5.1,                  context_window_tokens: 400000}
gpt-5.6-luna:           {family: GPT,      api_model: openai/gpt-5.6-luna,             context_window_tokens: 1050000}
gpt-5.6-terra:          {family: GPT,      api_model: openai/gpt-5.6-terra,            context_window_tokens: 1050000}
gemini-3.1-pro:         {family: Gemini,   api_model: google/gemini-3.1-pro-preview,   context_window_tokens: 1048576}
gemini-3.5-flash:       {family: Gemini,   api_model: google/gemini-3.5-flash,         context_window_tokens: 1048576}
gemini-3.5-flash-lite:  {family: Gemini,   api_model: google/gemini-3.5-flash-lite,    context_window_tokens: 1048576}
deepseek-v4-flash-0731: {family: DeepSeek, api_model: deepseek/deepseek-v4-flash-0731, context_window_tokens: 1048576,
                         request: {reasoning: {enabled: false}}}  # the study's DeepSeek runs had 0 reasoning tokens; with reasoning on, it eats the 8192-token output budget
glm-5.2:                {family: GLM,      api_model: z-ai/glm-5.2,                    context_window_tokens: 1048576,
                         request: {reasoning: {enabled: false}, provider: {ignore: [Phala]}}}  # the study's GLM runs had 0 reasoning tokens; the route now thinks by default
                         # 2026-10-02: Phala ignores reasoning.enabled=false and reasons until the output limit (no answer); excluded
claude-sonnet-5:        {family: Claude,   api_model: anthropic/claude-sonnet-5,       context_window_tokens: 1000000}
claude-haiku-4.5:       {family: Claude,   api_model: anthropic/claude-haiku-4.5,      context_window_tokens: 200000}
# Candidates for a one-model-per-provider roster (pre-ChatGPT replication, 2026-09).
qwen3.8-2.4t-a95b:      {family: Qwen,     api_model: qwen/qwen3.8-2.4t-a95b,          context_window_tokens: 1048576,
                         request: {reasoning: {max_tokens: 4096}}}  # unbounded thinking overran the 8192-token output budget in the pilot
# qwen/qwen3.8-max-* (Alibaba-hosted) is excluded by this OpenRouter account's zero-data-retention guardrail.
grok-4.7:               {family: Grok,     api_model: x-ai/grok-4.7,                              context_window_tokens: 500000,
                         request: {reasoning: {max_tokens: 4096}}}  # pilot reasoning ran to ~6.7k of the 8192-token output budget
kimi-k3:                {family: Kimi,     api_model: moonshotai/kimi-k3,                         context_window_tokens: 1048576,
                         request: {reasoning: {max_tokens: 4096}}}  # pilot reasoning ran to ~6.7k of the 8192-token output budget
mistral-medium-3.5:     {family: Mistral,  api_model: mistralai/mistral-medium-3-5,    context_window_tokens: 262144}
