# One entry per model. The key is the model's name in every record and its folder under results/first_reviews/; api_model is
# the OpenRouter identifier; request holds extra OpenRouter request fields (part of the response cache key).
# Eight-family panel: gpt-5.6-terra, gemini-3.1-pro, claude-sonnet-5, deepseek-v4-flash-0731, glm-5.2, qwen3.8-2.4t-a95b,
# grok-4.7, kimi-k3. Four-family panel (the Families comparison): gpt-5.1, gpt-5.6-luna, gpt-5.6-terra, gemini-3.1-pro,
# gemini-3.5-flash, gemini-3.5-flash-lite, deepseek-v4-flash-0731, glm-5.2. Area chairs: the four-family models and
# claude-sonnet-5. Weakness extraction: gpt-5.6-luna; coverage judge: gemini-3.5-flash-lite.
gpt-5.1:                {family: GPT,      api_model: openai/gpt-5.1,                  context_window_tokens: 400000}
gpt-5.6-luna:           {family: GPT,      api_model: openai/gpt-5.6-luna,             context_window_tokens: 1050000}
gpt-5.6-terra:          {family: GPT,      api_model: openai/gpt-5.6-terra,            context_window_tokens: 1050000}
gemini-3.1-pro:         {family: Gemini,   api_model: google/gemini-3.1-pro-preview,   context_window_tokens: 1048576}
gemini-3.5-flash:       {family: Gemini,   api_model: google/gemini-3.5-flash,         context_window_tokens: 1048576}
gemini-3.5-flash-lite:  {family: Gemini,   api_model: google/gemini-3.5-flash-lite,    context_window_tokens: 1048576}
# Reasoning off for DeepSeek and GLM: with it on, they spend the 8192-token output budget before answering.
deepseek-v4-flash-0731: {family: DeepSeek, api_model: deepseek/deepseek-v4-flash-0731, context_window_tokens: 1048576,
                         request: {reasoning: {enabled: false}}}
glm-5.2:                {family: GLM,      api_model: z-ai/glm-5.2,                    context_window_tokens: 1048576,
                         request: {reasoning: {enabled: false}, provider: {ignore: [Phala]}}}  # Phala ignores enabled: false
claude-sonnet-5:        {family: Claude,   api_model: anthropic/claude-sonnet-5,       context_window_tokens: 1000000}
# Reasoning capped at 4096 tokens for Qwen, Grok, and Kimi, so the answer fits in the 8192-token output budget.
qwen3.8-2.4t-a95b:      {family: Qwen,     api_model: qwen/qwen3.8-2.4t-a95b,          context_window_tokens: 1048576,
                         request: {reasoning: {max_tokens: 4096}}}
grok-4.7:               {family: Grok,     api_model: x-ai/grok-4.7,                   context_window_tokens: 500000,
                         request: {reasoning: {max_tokens: 4096}}}
kimi-k3:                {family: Kimi,     api_model: moonshotai/kimi-k3,              context_window_tokens: 1048576,
                         request: {reasoning: {max_tokens: 4096}}}
