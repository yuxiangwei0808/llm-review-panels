# Pre-ChatGPT replication with the paper's own eight-model roster (three GPT, three Gemini, DeepSeek,
# GLM), for a like-for-like comparison with Figure 1a. Same runs as iclr2022_prechatgpt.yaml; the
# score table holds all twelve models and the roster here selects eight.
name: iclr2022_prechatgpt_study8
models: [deepseek-v4-flash-0731, gemini-3.1-pro, gemini-3.5-flash, gemini-3.5-flash-lite,
         glm-5.2, gpt-5.1, gpt-5.6-luna, gpt-5.6-terra]
venues: [iclr2022]
scores: results/iclr2022_prechatgpt/scores.csv
manifest: data/manifests/iclr2022_prechatgpt.json
settings: [own, own_rubric]      # shared evidence deferred until the leave-one-reviewer-out design

# Content tables (human points, recognition labels, human curve) are shared with iclr2022_prechatgpt.
content_from: iclr2022_prechatgpt
